<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Jev Snake</title>
  </head>
  <body>
    <main class="layout">
      <section class="play">
        <header class="hud">
          <div>
            <h1>Jev Snake</h1>
            <p class="sub">Spectator · wraparound 16×16 · Jev picks the turn</p>
          </div>
          <div class="stats">
            <span>Score <strong id="score">0</strong></span>
            <span>Eaten <strong id="eaten">0</strong></span>
            <span>Missed <strong id="missed">0</strong></span>
            <span>Tick <strong id="tick">0</strong></span>
          </div>
        </header>
        <div class="board-wrap">
          <div id="board" class="board" aria-label="Snake board"></div>
        </div>
        <div class="timer" aria-label="Food timer">
          <div id="food-bar" class="timer-bar"></div>
        </div>
        <p id="status" class="status">Ready</p>
        <div class="controls">
          <button id="play" type="button">Start</button>
          <button id="pause" type="button" disabled>Pause</button>
          <button id="reset" type="button">New game</button>
        </div>
      </section>

      <section class="inspector">
        <header class="inspector-head">
          <h2>Last evaluate call</h2>
          <p id="call-meta" class="call-meta">No calls yet</p>
        </header>
        <div class="panes">
          <article class="pane pane-input">
            <h3>Input</h3>
            <div id="input-json" class="json"></div>
          </article>
          <article class="pane pane-output">
            <h3>Output</h3>
            <div id="output-json" class="json"></div>
          </article>
        </div>
        <h3 class="history-title">History</h3>
        <ol id="history" class="history"></ol>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
