<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Jev Snake</title>
  </head>
  <body>
    <main class="layout">
      <section class="game">
        <header>
          <h1>Jev Snake</h1>
          <p id="hud">score 0 · missed 0 · food 5.0s</p>
        </header>
        <div id="board" class="board"></div>
        <p class="controls">
          <button id="play" type="button">Start</button>
          <button id="pause" type="button" disabled>Pause</button>
          <button id="reset" type="button">New game</button>
        </p>
      </section>

      <section class="log">
        <header class="log-head">
          <h2>Moves</h2>
          <span id="status" class="badge" data-kind="ready">ready</span>
        </header>
        <div id="moves" class="moves"></div>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
